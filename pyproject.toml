[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonoplay"
version = "1.2.0"
description = "Plex DLNA Player - Bridge Plex to DLNA/UPnP speakers"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "plexdlnaplayer-enhanced contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiohttp>=3.9.0",
    "aiodns>=3.1.0,<3.2.0",  # capped: 3.2.0 breaks aiohttp's AsyncResolver (getaddrinfo signature change)
    "dotmap>=1.3.30",
    "fastapi>=0.103.0",
    "Jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.23.0",
    "xmltodict>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/aquantumofdonuts/sonoplay"
Repository = "https://github.com/aquantumofdonuts/sonoplay"
Issues = "https://github.com/aquantumofdonuts/sonoplay/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
