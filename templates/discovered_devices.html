{% extends "base.html" %}

{% block title %}SonoPlay - Devices{% endblock %}

{% block extra_head %}
<style>
    /* Icon button styles */
    .icon-btn {
        width: 36px;
        height: 36px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--bg-secondary);
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.15s ease;
    }

    .icon-btn:hover {
        background: var(--bg-tertiary);
        color: var(--text-primary);
    }

    .device-controls {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
    }

    .device-controls .control-btn {
        flex: 1;
    }

    .device-card:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }
</style>
{% endblock %}

{% block content %}
<!-- Page Header -->
<header class="page-header">
    <div>
        <h1 class="page-title">Discovered Devices</h1>
        <p class="page-subtitle" id="deviceCount">Scanning for devices...</p>
    </div>
    <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <label for="deviceSearchInput" class="sr-only">Search devices</label>
        <input type="text"
               id="deviceSearchInput"
               class="search-input"
               placeholder="Search devices..."
               aria-label="Search devices">
    </div>
</header>

<!-- Device Grid -->
<div id="devicesList" class="device-grid">
    <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Scanning for devices...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Device cache
    let lastFetchedDevices = [];

    // API Functions
    async function fetchDevices() {
        try {
            const response = await fetch('/api/devices');
            const data = await response.json();
            return data.devices || [];
        } catch (error) {
            console.error('Error fetching devices:', error);
            return [];
        }
    }

    async function checkLinked(uuid) {
        await runPlexPinFlow(uuid, { mode: 'link', subject: 'Device' });
        refreshDevices();
    }

    async function relinkDevice(uuid) {
        await runPlexPinFlow(uuid, { mode: 'relink', subject: 'Device' });
        refreshDevices();
    }

    async function updateDeviceName(uuid, name) {
        try {
            const formData = new FormData();
            formData.append('uuid', uuid);
            formData.append('name', name);

            const response = await fetch('/', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Unexpected response');

            Swal.fire({
                icon: 'success',
                title: 'Name Updated',
                timer: 2000,
                showConfirmButton: false
            });
            return true;
        } catch (error) {
            console.error('Error updating device name:', error);
            Swal.fire('Error', 'Failed to update device name', 'error');
            throw error;
        }
    }

    // Card renderer for a single device
    function createDeviceCard(device) {
        const isOnline = device.status === 'online' || device.status === 'playing';
        const isPlaying = device.status === 'playing';
        const isLinked = device.binded;

        // Status
        let statusClass = 'offline';
        let statusText = 'Offline';
        if (isPlaying) {
            statusClass = 'playing';
            statusText = 'Now Playing';
        } else if (isLinked) {
            statusClass = 'linked';
            statusText = 'Linked';
        } else if (isOnline) {
            statusClass = 'online';
            statusText = 'Ready';
        }

        // Safe values
        const safeName = escapeHtml(device.name || 'Unknown Device');
        const safeType = escapeHtml(device.model || device.manufacturer || 'DLNA Device');
        const safeUuid = escapeHtml(device.uuid || '');

        // Now Playing section
        let nowPlayingHtml = '';
        const track = device.current_track || {};
        if (isPlaying && track.title) {
            const progress = device.elapsed_ms || 0;
            const duration = track.duration || 0;
            const progressPercent = duration > 0 ? Math.min(100, (progress / duration) * 100) : 0;

            nowPlayingHtml = `
                <div class="now-playing">
                    <div class="now-playing-label">Now Playing</div>
                    <div class="now-playing-track">${escapeHtml(track.title)}</div>
                    <div class="now-playing-artist">${escapeHtml(track.artist || 'Unknown Artist')}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progressPercent}%"></div>
                    </div>
                    <div class="progress-time">
                        <span>${formatDuration(progress)}</span>
                        <span>${formatDuration(duration)}</span>
                    </div>
                </div>
                <div class="playback-controls">
                    <button class="playback-btn" data-action="prev" aria-label="Previous track">
                        <i class="fas fa-step-backward"></i>
                    </button>
                    <button class="playback-btn main" data-action="pause" aria-label="Pause">
                        <i class="fas fa-pause"></i>
                    </button>
                    <button class="playback-btn" data-action="next" aria-label="Next track">
                        <i class="fas fa-step-forward"></i>
                    </button>
                </div>
            `;
        }

        // Action button
        let actionButton = '';
        if (!isLinked) {
            actionButton = `
                <button class="control-btn primary" data-action="link">
                    <i class="fas fa-link"></i>
                    Link
                </button>
            `;
        } else if (!isPlaying) {
            actionButton = `
                <button class="control-btn" data-action="relink">
                    <i class="fas fa-sync"></i>
                    Relink
                </button>
            `;
        }

        return `
            <div class="device-card ${isPlaying ? 'playing' : ''} ${isLinked && !isPlaying ? 'linked' : ''}"
                 data-uuid="${safeUuid}" data-action="details"
                 role="button" tabindex="0" aria-label="${safeName} details">
                <div class="device-header">
                    <div class="device-icon">
                        <i class="fas fa-volume-up"></i>
                    </div>
                    <div class="device-info">
                        <div class="device-name">${safeName}</div>
                        <div class="device-type">${safeType}</div>
                        <div class="device-status ${statusClass}">
                            <span class="status-dot"></span>
                            ${statusText}
                        </div>
                    </div>
                </div>
                ${nowPlayingHtml}
                <div class="device-controls">
                    ${actionButton}
                    <button class="icon-btn" data-action="edit" title="Edit" aria-label="Edit device name">
                        <i class="fas fa-pen"></i>
                    </button>
                </div>
            </div>
        `;
    }

    // Device Grid Renderer (patches keyed cards in place; see shared.js)
    function renderDeviceGrid(devices) {
        const grid = document.getElementById('devicesList');
        const countEl = document.getElementById('deviceCount');
        if (!grid) return;

        // Update count
        if (countEl) {
            const count = devices ? devices.length : 0;
            countEl.textContent = `${count} device${count !== 1 ? 's' : ''} on your network`;
        }

        // Empty state
        if (!devices || devices.length === 0) {
            resetGrid(grid, `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <i class="fas fa-broadcast-tower empty-state-icon"></i>
                    <h3 class="empty-state-title">No devices found</h3>
                    <p class="empty-state-text">Make sure your DLNA devices are powered on and connected to the network.</p>
                </div>
            `);
            return;
        }

        patchKeyedGrid(grid, devices, d => d.uuid, createDeviceCard);
    }

    async function sendCommand(uuid, command) {
        try {
            await sendPlaybackCommand(uuid, command);
            setTimeout(refreshDevices, 500);
        } catch (error) {
            console.error('Command error:', error);
            Swal.fire('Error', 'Failed to send command', 'error');
        }
    }

    function showDeviceDetails(uuid) {
        const device = lastFetchedDevices.find(d => d.uuid === uuid);
        if (!device) return;

        const safeName = escapeHtml(device.name || 'Unknown Device');
        const safeIp = escapeHtml(device.ip || 'Unknown');
        const safeModel = escapeHtml(device.model || device.manufacturer || 'Unknown');

        Swal.fire({
            title: safeName,
            html: `
                <div style="text-align: left;">
                    <p><strong>IP Address:</strong> ${safeIp}</p>
                    <p><strong>Model:</strong> ${safeModel}</p>
                    <p><strong>Status:</strong> ${escapeHtml(device.status || 'Unknown')}</p>
                    <p><strong>Linked:</strong> ${device.binded ? 'Yes' : 'No'}</p>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'Rename',
            cancelButtonText: 'Close'
        }).then((result) => {
            if (result.isConfirmed) {
                editDeviceName(uuid, device.name);
            }
        });
    }

    function editDeviceName(uuid, currentName) {
        Swal.fire({
            title: 'Rename Device',
            input: 'text',
            inputValue: currentName || '',
            showCancelButton: true,
            inputValidator: (value) => {
                if (!value) return 'Please enter a name';
            }
        }).then((result) => {
            if (result.isConfirmed) {
                updateDeviceName(uuid, result.value).then(() => refreshDevices());
            }
        });
    }

    async function refreshDevices() {
        const devices = await fetchDevices();
        lastFetchedDevices = devices;

        // Filter by search
        const searchInput = document.getElementById('deviceSearchInput');
        const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';

        const filteredDevices = devices.filter(device => {
            if (!searchTerm) return true;
            return (device.name || '').toLowerCase().includes(searchTerm) ||
                   (device.ip || '').toLowerCase().includes(searchTerm);
        });

        renderDeviceGrid(filteredDevices);
    }

    // Delegated card actions: no inline onclick handlers, so device names
    // with quotes can't break the markup, and patched cards keep working.
    function handleCardAction(target) {
        const actionEl = target.closest('[data-action]');
        if (!actionEl) return;
        const card = actionEl.closest('.device-card');
        const uuid = card ? card.dataset.uuid : null;
        if (!uuid) return;
        const device = lastFetchedDevices.find(d => d.uuid === uuid);
        switch (actionEl.dataset.action) {
            case 'details': showDeviceDetails(uuid); break;
            case 'link': checkLinked(uuid); break;
            case 'relink': relinkDevice(uuid); break;
            case 'edit': editDeviceName(uuid, device ? device.name : ''); break;
            case 'prev': sendCommand(uuid, 'previous'); break;
            case 'pause': sendCommand(uuid, 'pause'); break;
            case 'next': sendCommand(uuid, 'next'); break;
        }
    }

    const devicesGrid = document.getElementById('devicesList');
    devicesGrid.addEventListener('click', (e) => handleCardAction(e.target));
    devicesGrid.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        if (e.target.classList && e.target.classList.contains('device-card')) {
            e.preventDefault();
            handleCardAction(e.target);
        }
    });

    // Search handler
    document.getElementById('deviceSearchInput')?.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filteredDevices = lastFetchedDevices.filter(device => {
            if (!searchTerm) return true;
            return (device.name || '').toLowerCase().includes(searchTerm) ||
                   (device.ip || '').toLowerCase().includes(searchTerm);
        });
        renderDeviceGrid(filteredDevices);
    });

    // Initial load and polling
    document.addEventListener('DOMContentLoaded', () => {
        refreshDevices();
        // Poll every 5 seconds
        setInterval(refreshDevices, 5000);
    });
</script>
{% endblock %}
