<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SonoPlay{% endblock %}</title>
    
    <!-- Google Fonts (cosmetic only — system fonts are the offline fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Font Awesome (vendored: the UI must work on LANs without internet) -->
    <link rel="stylesheet" href="/static/vendor/fontawesome.min.css">

    <!-- SweetAlert2 (vendored: every dialog depends on it) -->
    <link rel="stylesheet" href="/static/vendor/sweetalert2.min.css">
    
    <!-- Minimal Clean Theme -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/minimal-clean.css') }}">
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app">
        <!-- Navigation -->
        <nav class="nav">
            <div class="nav-inner">
                <!-- Brand -->
                <a href="/" class="nav-brand">
                    <div class="nav-brand-icon">
                        <i class="fas fa-play"></i>
                    </div>
                    <span>SonoPlay</span>
                </a>
                
                <!-- Center Nav Links -->
                <div class="nav-center">
                    <div class="nav-links">
                        <a href="/" class="nav-link {% if active_page == 'devices' %}active{% endif %}">
                            <i class="fas fa-broadcast-tower"></i>
                            <span>Devices</span>
                        </a>
                        <a href="/virtual-devices" class="nav-link {% if active_page == 'groups' %}active{% endif %}">
                            <i class="fas fa-layer-group"></i>
                            <span>Groups</span>
                        </a>
                    </div>
                </div>
                
                <!-- Right side: Settings + Plex Status -->
                <div class="nav-right" style="display: flex; align-items: center; gap: 1rem;">
                    <!-- Settings Button -->
                    <button class="nav-settings-btn" onclick="openSettingsModal()" title="Audio Settings" style="background: none; border: none; cursor: pointer; padding: 0.5rem; color: var(--text-secondary); font-size: 1.1rem; transition: color 0.2s;">
                        <i class="fas fa-cog"></i>
                    </button>
                    
                    <!-- Plex Status -->
                    <button type="button" class="plex-status disconnected" id="plexStatus" onclick="handlePlexClick()">
                        <span class="plex-dot"></span>
                        <span class="plex-text">Connect Plex</span>
                    </button>
                </div>
            </div>
        </nav>
        
        <!-- Audio Settings Modal -->
        <div id="settingsModal" class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
            <div class="settings-modal-content" style="background: var(--bg-primary); border-radius: 12px; padding: 2rem; max-width: 450px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 id="settingsModalTitle" style="margin: 0; font-size: 1.25rem; font-weight: 600;">Audio Settings</h2>
                    <button onclick="closeSettingsModal()" aria-label="Close settings" style="background: none; border: none; cursor: pointer; font-size: 1.5rem; color: var(--text-secondary); line-height: 1;">&times;</button>
                </div>
                
                <p style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1.5rem;">
                    Tracks exceeding these thresholds will be transcoded for device compatibility.
                </p>
                
                <!-- Bitrate Slider -->
                <div style="margin-bottom: 1.5rem;">
                    <label for="bitrateSlider" style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 500;">
                        <span>Bitrate Limit</span>
                        <span id="bitrateValue" style="color: var(--text-secondary);">1500 kbps</span>
                    </label>
                    <input type="range" id="bitrateSlider" min="0" max="6" value="4" 
                           style="width: 100%; cursor: pointer;"
                           oninput="updateBitrateLabel(this.value)">
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-tertiary); margin-top: 0.25rem;">
                        <span>Off</span>
                        <span>5000</span>
                    </div>
                </div>
                
                <!-- Sample Rate Slider -->
                <div style="margin-bottom: 2rem;">
                    <label for="sampleRateSlider" style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 500;">
                        <span>Sample Rate Limit</span>
                        <span id="sampleRateValue" style="color: var(--text-secondary);">48 kHz</span>
                    </label>
                    <input type="range" id="sampleRateSlider" min="0" max="4" value="2"
                           style="width: 100%; cursor: pointer;"
                           oninput="updateSampleRateLabel(this.value)">
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-tertiary); margin-top: 0.25rem;">
                        <span>Off</span>
                        <span>192 kHz</span>
                    </div>
                </div>
                
                <!-- Save Button -->
                <button id="saveSettingsBtn" onclick="saveAudioSettings()" 
                        style="width: 100%; padding: 0.75rem; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; font-size: 1rem;">
                    Save Settings
                </button>
            </div>
        </div>
        
        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    {% block modals %}{% endblock %}
    
    <!-- Scripts -->
    <script src="/static/vendor/sweetalert2.all.min.js"></script>
    
    <script src="/static/js/shared.js"></script>
    <script>
        // Plex Status Management
        let plexConnected = false;
        
        async function checkPlexStatus() {
            try {
                const response = await fetch('/api/plex-status');
                if (response.ok) {
                    const data = await response.json();
                    updatePlexUI(data.connected);
                }
            } catch (error) {
                console.error('Failed to check Plex status:', error);
            }
        }
        
        function updatePlexUI(connected) {
            plexConnected = connected;
            const statusEl = document.getElementById('plexStatus');
            const textEl = statusEl.querySelector('.plex-text');
            
            if (connected) {
                statusEl.classList.remove('disconnected');
                statusEl.classList.add('connected');
                textEl.textContent = 'Plex';
            } else {
                statusEl.classList.remove('connected');
                statusEl.classList.add('disconnected');
                textEl.textContent = 'Connect Plex';
            }
        }
        
        function handlePlexClick() {
            if (plexConnected) {
                // Show disconnect option
                Swal.fire({
                    title: 'Plex Connected',
                    text: 'Your Plex account is linked.',
                    icon: 'success',
                    showCancelButton: true,
                    confirmButtonText: 'OK',
                    cancelButtonText: 'Disconnect',
                    cancelButtonColor: '#dc2626'
                }).then((result) => {
                    if (result.dismiss === Swal.DismissReason.cancel) {
                        // Handle disconnect
                        disconnectPlex();
                    }
                });
            } else {
                // Trigger PIN login flow with device picker
                startPlexLogin();
            }
        }
        
        async function startPlexLogin() {
            try {
                // Fetch available devices
                const response = await fetch('/api/devices');
                if (!response.ok) throw new Error('Failed to fetch devices');
                const data = await response.json();
                const devices = data.devices || [];
                
                if (devices.length === 0) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'No Devices Found',
                        text: 'Please wait for devices to be discovered.',
                    });
                    return;
                }
                
                // Find unlinked devices
                const unlinkedDevices = devices.filter(d => !d.binded);
                
                if (unlinkedDevices.length === 0) {
                    Swal.fire({
                        icon: 'success',
                        title: 'All Devices Linked',
                        text: 'All your devices are already connected to Plex.',
                    });
                    return;
                }
                
                // If only one unlinked device, link it directly
                let selectedDevice = unlinkedDevices[0];
                
                // If multiple unlinked devices, show picker
                if (unlinkedDevices.length > 1) {
                    const deviceOptions = {};
                    unlinkedDevices.forEach(d => {
                        deviceOptions[d.uuid] = d.name;
                    });
                    
                    const result = await Swal.fire({
                        title: 'Select Device to Link',
                        input: 'select',
                        inputOptions: deviceOptions,
                        inputPlaceholder: 'Choose a device',
                        showCancelButton: true,
                        inputValidator: (value) => {
                            if (!value) return 'Please select a device';
                        }
                    });
                    
                    if (!result.isConfirmed) return;
                    selectedDevice = unlinkedDevices.find(d => d.uuid === result.value);
                }
                
                // Run the shared PIN link flow (defined in shared.js)
                const linked = await runPlexPinFlow(selectedDevice.uuid, { subject: selectedDevice.name });
                if (linked) {
                    checkPlexStatus();
                }
            } catch (error) {
                console.error('Failed to start Plex login:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Connection Failed',
                    text: 'Failed to start Plex authentication. Please try again.',
                });
            }
        }
        
        async function disconnectPlex() {
            try {
                const response = await fetch('/api/plex-disconnect', { method: 'POST' });
                if (!response.ok) throw new Error(`Disconnect failed (${response.status})`);
                updatePlexUI(false);
                Swal.fire({
                    icon: 'success',
                    title: 'Disconnected',
                    text: 'Plex account has been unlinked.',
                    timer: 2000,
                    showConfirmButton: false
                });
            } catch (error) {
                console.error('Failed to disconnect Plex:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Disconnect Failed',
                    text: 'Could not unlink Plex. Please try again.'
                });
            }
        }
        
        // Check Plex status on page load
        document.addEventListener('DOMContentLoaded', checkPlexStatus);
    </script>
    
    <!-- Audio Settings Modal -->
    <script>
        // Slider value mappings
        const bitrateStops = [0, 320, 500, 1000, 1500, 3000, 5000];
        const sampleRateStops = [0, 44100, 48000, 96000, 192000];
        
        function updateBitrateLabel(index) {
            const value = bitrateStops[index];
            const label = document.getElementById('bitrateValue');
            label.textContent = value === 0 ? 'Disabled' : `${value} kbps`;
        }
        
        function updateSampleRateLabel(index) {
            const value = sampleRateStops[index];
            const label = document.getElementById('sampleRateValue');
            if (value === 0) {
                label.textContent = 'Disabled';
            } else if (value >= 1000) {
                label.textContent = `${value / 1000} kHz`;
            } else {
                label.textContent = `${value} Hz`;
            }
        }
        
        function findSliderIndex(value, stops) {
            if (!value || value === 0) return 0;
            for (let i = stops.length - 1; i >= 0; i--) {
                if (stops[i] <= value) return i;
            }
            return 0;
        }
        
        let settingsModalPrevFocus = null;

        async function openSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.style.display = 'flex';

            // Move focus into the dialog; restore on close
            settingsModalPrevFocus = document.activeElement;
            document.getElementById('bitrateSlider')?.focus();

            // Fetch current settings
            try {
                const response = await fetch('/api/audio-settings');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Set slider positions
                    const bitrateIdx = findSliderIndex(data.bitrate_kbps, bitrateStops);
                    const sampleRateIdx = findSliderIndex(data.sample_rate_hz, sampleRateStops);
                    
                    document.getElementById('bitrateSlider').value = bitrateIdx;
                    document.getElementById('sampleRateSlider').value = sampleRateIdx;
                    
                    updateBitrateLabel(bitrateIdx);
                    updateSampleRateLabel(sampleRateIdx);
                }
            } catch (error) {
                console.error('Failed to load audio settings:', error);
            }
        }
        
        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
            if (settingsModalPrevFocus && typeof settingsModalPrevFocus.focus === 'function') {
                settingsModalPrevFocus.focus();
            }
            settingsModalPrevFocus = null;
        }
        
        async function saveAudioSettings() {
            const bitrateIdx = document.getElementById('bitrateSlider').value;
            const sampleRateIdx = document.getElementById('sampleRateSlider').value;
            
            const bitrate = bitrateStops[bitrateIdx];
            const sampleRate = sampleRateStops[sampleRateIdx];
            
            try {
                const response = await fetch('/api/audio-settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bitrate_kbps: bitrate || null,
                        sample_rate_hz: sampleRate || null
                    })
                });
                
                if (response.ok) {
                    closeSettingsModal();
                    Swal.fire({
                        icon: 'success',
                        title: 'Settings Saved',
                        text: 'Audio transcoding thresholds updated.',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    throw new Error('Failed to save');
                }
            } catch (error) {
                console.error('Failed to save audio settings:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Save Failed',
                    text: 'Could not save audio settings. Please try again.'
                });
            }
        }
        
        // Close modal on backdrop click
        document.getElementById('settingsModal')?.addEventListener('click', function(e) {
            if (e.target === this) closeSettingsModal();
        });

        // Trap Tab focus inside the dialog while it's open
        document.getElementById('settingsModal')?.addEventListener('keydown', function(e) {
            if (e.key !== 'Tab') return;
            const focusables = this.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])');
            if (!focusables.length) return;
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (e.shiftKey && document.activeElement === first) {
                e.preventDefault();
                last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first.focus();
            }
        });

        // Close modal on Escape key (only when it's open)
        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Escape') return;
            const modal = document.getElementById('settingsModal');
            if (modal && modal.style.display !== 'none') closeSettingsModal();
        });
    </script>
    
    <!-- Onboarding Wizard -->
    <script>
        const OnboardingWizard = {
            devices: [],
            selectedDevices: [],
            groupName: 'My Speakers',
            
            async checkEligibility() {
                try {
                    const response = await fetch('/api/onboarding');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.eligible && !data.completed) {
                            this.start();
                        }
                    }
                } catch (error) {
                    console.error('Onboarding check failed:', error);
                }
            },
            
            async start() {
                await this.stepWelcome();
            },
            
            // Step 1: Welcome
            async stepWelcome() {
                const result = await Swal.fire({
                    title: 'Welcome to SonoPlay!',
                    html: `
                        <p style="margin-bottom: 1rem;">SonoPlay connects your Plex Media Server to DLNA/UPnP speakers and devices.</p>
                        <p>Let's set up your first device in just a few steps.</p>
                    `,
                    icon: 'info',
                    confirmButtonText: 'Get Started',
                    showCancelButton: true,
                    cancelButtonText: 'Skip Setup',
                    allowOutsideClick: false
                });
                
                if (result.isConfirmed) {
                    await this.stepDiscoverDevices();
                } else {
                    await this.markComplete();
                }
            },
            
            // Step 2: Discover Devices
            async stepDiscoverDevices() {
                // Show loading while fetching devices
                Swal.fire({
                    title: 'Discovering Devices...',
                    html: 'Scanning your network for DLNA speakers and devices.',
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });
                
                try {
                    const response = await fetch('/api/devices');
                    if (!response.ok) throw new Error('Failed to fetch devices');
                    const data = await response.json();
                    this.devices = data.devices || [];
                } catch (error) {
                    console.error('Device discovery failed:', error);
                    this.devices = [];
                }
                
                if (this.devices.length === 0) {
                    const result = await Swal.fire({
                        title: 'No Devices Found',
                        html: `
                            <p>No DLNA devices were discovered on your network.</p>
                            <p style="margin-top: 1rem; color: #666;">Make sure your speakers are powered on and connected to the same network.</p>
                        `,
                        icon: 'warning',
                        confirmButtonText: 'Retry',
                        showCancelButton: true,
                        cancelButtonText: 'Finish Setup'
                    });
                    
                    if (result.isConfirmed) {
                        await this.stepDiscoverDevices();
                    } else {
                        await this.stepFinal();
                    }
                    return;
                }
                
                // Display found devices
                const deviceListHtml = this.devices.map((device, idx) => `
                    <div class="onboarding-device" style="display: flex; align-items: center; padding: 0.75rem; border: 1px solid #e5e5e5; border-radius: 8px; margin-bottom: 0.5rem;">
                        <input type="checkbox" id="dev-${idx}" value="${idx}" checked style="margin-right: 0.75rem; width: 18px; height: 18px;">
                        <label for="dev-${idx}" style="flex: 1; cursor: pointer;">
                            <div style="font-weight: 500;">${escapeHtml(device.name)}</div>
                            <div style="font-size: 0.85rem; color: #666;">${escapeHtml(device.location || 'DLNA Device')}</div>
                        </label>
                        <span style="font-size: 0.75rem; padding: 2px 8px; background: ${device.binded ? '#dcfce7' : '#fef3c7'}; color: ${device.binded ? '#166534' : '#92400e'}; border-radius: 4px;">
                            ${device.binded ? 'Linked' : 'Not Linked'}
                        </span>
                    </div>
                `).join('');
                
                const result = await Swal.fire({
                    title: 'Devices Found!',
                    html: `
                        <p style="margin-bottom: 1rem;">Select the devices you want to set up:</p>
                        <div style="max-height: 300px; overflow-y: auto; text-align: left;">
                            ${deviceListHtml}
                        </div>
                    `,
                    confirmButtonText: 'Continue',
                    showCancelButton: true,
                    cancelButtonText: 'Skip',
                    preConfirm: () => {
                        const checkboxes = Swal.getPopup().querySelectorAll('input[type="checkbox"]:checked');
                        return Array.from(checkboxes).map(cb => parseInt(cb.value));
                    }
                });
                
                if (result.isConfirmed && result.value.length > 0) {
                    this.selectedDevices = result.value.map(idx => this.devices[idx]);
                    await this.stepConfigureDevices(0);
                } else {
                    await this.stepCreateGroup();
                }
            },
            
            // Step 3: Configure Each Device (Rename & Link)
            async stepConfigureDevices(deviceIndex) {
                if (deviceIndex >= this.selectedDevices.length) {
                    await this.stepCreateGroup();
                    return;
                }
                
                const device = this.selectedDevices[deviceIndex];
                const remaining = this.selectedDevices.length - deviceIndex;
                
                const result = await Swal.fire({
                    title: `Configure: ${device.name}`,
                    html: `
                        <p style="margin-bottom: 1rem; color: #666;">Device ${deviceIndex + 1} of ${this.selectedDevices.length}</p>
                        <div style="text-align: left; margin-bottom: 1rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Device Name:</label>
                            <input type="text" id="device-name" class="swal2-input" value="${escapeHtml(device.name)}" style="margin: 0; width: 100%;">
                        </div>
                        ${!device.binded ? `
                            <div style="text-align: left; padding: 1rem; background: #fef3c7; border-radius: 8px;">
                                <p style="margin: 0; color: #92400e;">
                                    <strong>Link to Plex?</strong><br>
                                    Linking allows Plex to cast directly to this device.
                                </p>
                            </div>
                        ` : `
                            <div style="text-align: left; padding: 1rem; background: #dcfce7; border-radius: 8px;">
                                <p style="margin: 0; color: #166534;">✓ Already linked to Plex</p>
                            </div>
                        `}
                    `,
                    confirmButtonText: device.binded ? 'Save & Continue' : 'Link & Continue',
                    showCancelButton: true,
                    cancelButtonText: remaining > 1 ? 'Skip Device' : 'Skip',
                    showDenyButton: !device.binded,
                    denyButtonText: 'Save Without Linking',
                    denyButtonColor: '#6b7280',
                    preConfirm: () => {
                        return {
                            name: document.getElementById('device-name').value,
                            link: !device.binded
                        };
                    },
                    preDeny: () => {
                        return {
                            name: document.getElementById('device-name').value,
                            link: false
                        };
                    }
                });
                
                if (result.isConfirmed || result.isDenied) {
                    const newName = result.isConfirmed ? result.value.name : (result.isDenied ? document.getElementById('device-name')?.value || device.name : device.name);
                    const shouldLink = result.isConfirmed && !device.binded;
                    
                    // Update device name if changed
                    if (newName && newName !== device.name) {
                        try {
                            await fetch('/', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                body: `action=updateName&uuid=${encodeURIComponent(device.uuid)}&name=${encodeURIComponent(newName)}`
                            });
                            device.name = newName;
                        } catch (error) {
                            console.error('Failed to update device name:', error);
                        }
                    }
                    
                    // Link if requested
                    if (shouldLink) {
                        await this.linkDevice(device);
                    }
                }
                
                // Move to next device
                await this.stepConfigureDevices(deviceIndex + 1);
            },
            
            async linkDevice(device) {
                // Shared PIN link flow (defined in shared.js)
                const linked = await runPlexPinFlow(device.uuid, { subject: device.name });
                if (linked) {
                    device.binded = true;
                }
            },
            
            // Step 4: Create Group
            async stepCreateGroup() {
                if (this.devices.length < 2) {
                    // Not enough devices for a group
                    await this.stepFinal();
                    return;
                }
                
                const result = await Swal.fire({
                    title: 'Create a Device Group?',
                    html: `
                        <p style="margin-bottom: 1rem;">Groups let you play music on multiple speakers at once.</p>
                        <div style="text-align: left; margin-bottom: 1rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Group Name:</label>
                            <input type="text" id="group-name" class="swal2-input" value="${this.groupName}" placeholder="e.g., Living Room Speakers" style="margin: 0; width: 100%;">
                        </div>
                        <p style="color: #666; font-size: 0.9rem;">You can create more groups later from the Groups page.</p>
                    `,
                    confirmButtonText: 'Create Group',
                    showCancelButton: true,
                    cancelButtonText: 'Skip',
                    preConfirm: () => {
                        return document.getElementById('group-name').value || this.groupName;
                    }
                });
                
                if (result.isConfirmed && result.value) {
                    this.groupName = result.value;
                    await this.stepSelectGroupDevices();
                } else {
                    await this.stepFinal();
                }
            },
            
            // Step 5: Select Devices for Group
            async stepSelectGroupDevices() {
                const deviceListHtml = this.devices.map((device, idx) => `
                    <div style="display: flex; align-items: center; padding: 0.75rem; border: 1px solid #e5e5e5; border-radius: 8px; margin-bottom: 0.5rem;">
                        <input type="checkbox" id="grp-dev-${idx}" value="${device.uuid}" checked style="margin-right: 0.75rem; width: 18px; height: 18px;">
                        <label for="grp-dev-${idx}" style="flex: 1; cursor: pointer;">
                            <div style="font-weight: 500;">${escapeHtml(device.name)}</div>
                        </label>
                    </div>
                `).join('');
                
                const result = await Swal.fire({
                    title: `Select Devices for "${this.groupName}"`,
                    html: `
                        <p style="margin-bottom: 1rem;">Choose which devices to include:</p>
                        <div style="max-height: 250px; overflow-y: auto; text-align: left;">
                            ${deviceListHtml}
                        </div>
                    `,
                    confirmButtonText: 'Create Group',
                    showCancelButton: true,
                    cancelButtonText: 'Skip',
                    preConfirm: () => {
                        const checkboxes = Swal.getPopup().querySelectorAll('input[type="checkbox"]:checked');
                        return Array.from(checkboxes).map(cb => cb.value);
                    }
                });
                
                if (result.isConfirmed && result.value.length >= 2) {
                    // Create the group
                    Swal.fire({
                        title: 'Creating Group...',
                        allowOutsideClick: false,
                        didOpen: () => Swal.showLoading()
                    });
                    
                    try {
                        const response = await fetch('/api/virtual-devices', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: this.groupName,
                                member_uuids: result.value
                            })
                        });
                        
                        if (response.ok) {
                            await Swal.fire({
                                icon: 'success',
                                title: 'Group Created!',
                                text: `"${this.groupName}" is ready to use.`,
                                timer: 1500,
                                showConfirmButton: false
                            });
                        } else {
                            // Handle API error
                            let errorMsg = 'Failed to create group. You can try again from the Groups page.';
                            try {
                                const errorData = await response.json();
                                if (errorData.detail?.message) {
                                    errorMsg = errorData.detail.message;
                                }
                            } catch (e) {}
                            await Swal.fire({
                                icon: 'warning',
                                title: 'Group Not Created',
                                text: errorMsg,
                                timer: 3000,
                                showConfirmButton: true
                            });
                        }
                    } catch (error) {
                        console.error('Failed to create group:', error);
                        await Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: 'Failed to create group. You can try again from the Groups page.',
                            timer: 3000,
                            showConfirmButton: true
                        });
                    }
                } else if (result.isConfirmed && result.value.length < 2) {
                    await Swal.fire({
                        icon: 'info',
                        title: 'Need More Devices',
                        text: 'Groups require at least 2 devices.',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }
                
                await this.stepFinal();
            },
            
            // Step 6: Final Welcome
            async stepFinal() {
                await Swal.fire({
                    title: 'Setup Complete!',
                    html: `
                        <p style="margin-bottom: 1rem;">You're all set to start streaming with SonoPlay.</p>
                        <div style="text-align: left; padding: 1rem; background: #f5f5f5; border-radius: 8px;">
                            <p style="margin: 0 0 0.5rem 0;"><strong>Quick Tips:</strong></p>
                            <ul style="margin: 0; padding-left: 1.25rem; color: #666;">
                                <li>Open Plex and cast to your devices</li>
                                <li>Use Groups to play on multiple speakers</li>
                                <li>Link devices for seamless casting</li>
                            </ul>
                        </div>
                    `,
                    icon: 'success',
                    confirmButtonText: 'Start Using SonoPlay'
                });
                
                await this.markComplete();
                
                // Redirect to discovered devices page
                if (window.location.pathname !== '/') {
                    window.location.href = '/';
                } else {
                    // Refresh to show any changes
                    window.location.reload();
                }
            },
            
            async markComplete() {
                try {
                    await fetch('/api/onboarding', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ completed: true })
                    });
                } catch (error) {
                    console.error('Failed to mark onboarding complete:', error);
                }
            }
        };
        
        // Check onboarding eligibility on page load
        document.addEventListener('DOMContentLoaded', () => {
            OnboardingWizard.checkEligibility();
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
